# Lab Overseer — what the bot says.
#
# Everything here is commented out, so the built-in wording is used.
# To change a message: remove the leading '# ' from its line and edit the text.
# Then restart:  systemctl restart overseer   (or: overseer menu → Restart)
#
# {words} in curly braces get filled in automatically — keep the ones you want, drop the rest.
# \n makes a new line. Emoji are fine. This file is never overwritten by updates.

# How the AI talks (pick one line). Plain English. Changes tone/language only — never safety rules.
# ai_style: "Be casual and a bit sarcastic."
# ai_style: "Reply in Spanish."

# Severity icons, 0 = noise … 4 = security
# icons: {0: "·", 1: "🟡", 2: "🟠", 3: "🔴", 4: "🚨"}

# ---- Lifecycle & commands ----
#   placeholders: {ai} {mode}
# online: "👁 Overseer online ({ai}, {mode})."
# help: "Commands: /status · /auto · /watch · /go <id> · /stop <id>"
# mode_auto: "🤖 AUTO — fixes you approve with Go will actually run"
# mode_watch: "👀 WATCH — alerts only; Go just simulates"

# ---- Incident alerts ----
#   placeholders: {icon} {tier} {id} {target} {summary}
